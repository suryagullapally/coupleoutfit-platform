services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: coupleoutfit
      POSTGRES_USER: ${DATABASE_USERNAME:-coupleoutfit_local}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local_dev_only}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
volumes:
  postgres_data:
