spring:
  application:
    name: coupleoutfit-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    time-zone: UTC
  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
server:
  port: ${PORT:8080}
  forward-headers-strategy: none
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
coupleoutfit:
  feed:
    batch-size: 500
    max-bytes: 67108864
    max-rejected-rows: 1000
    local-root: .local/affiliate-feeds
  matching:
    candidate-limit: 50
    result-limit: 12
    minimum-score: 60
  ai:
    embeddings:
      provider: ${EMBEDDING_PROVIDER:disabled}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: 1536
      connect-timeout: PT5S
      request-timeout: PT20S
      max-attempts: 2
      retry-backoff: PT0.25S
    clothing-analysis:
      provider: ${CLOTHING_ANALYSIS_PROVIDER:disabled}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_CLOTHING_ANALYSIS_MODEL:}
      connect-timeout: PT5S
      request-timeout: PT20S
      max-attempts: 2
      retry-backoff: PT0.25S
      image-detail: low
      max-output-tokens: 2048
  storage:
    provider: ${SOURCE_STORAGE_PROVIDER:disabled}
    local:
      root: ${SOURCE_STORAGE_LOCAL_ROOT:.local/source-assets}
  source:
    public-origin: ${SOURCE_PUBLIC_ORIGIN:http://localhost:8080}
    session:
      signing-key: ${SOURCE_SESSION_SIGNING_KEY:}
      lifetime: P7D
    upload:
      max-bytes: 10485760
      allowed-media-types: image/jpeg,image/png,image/webp
      max-pixels: 25000000
      max-dimension: 10000
      max-concurrent-verifications: 2
      authorization-ttl: PT15M
      verification-lease: PT2M
  market:
    default-country-code: ${MARKET_DEFAULT_COUNTRY_CODE:GB}
    default-currency-code: ${MARKET_DEFAULT_CURRENCY_CODE:GBP}
    default-locale-code: ${MARKET_DEFAULT_LOCALE_CODE:en-GB}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
logging:
  pattern:
    dateformat: yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC
    level: '%5p [requestId=%X{requestId:-}]'
